name: NexaShopify CI

# Déclencheurs : Quand ce pipeline doit-il s'exécuter ?
on:
  push:
    branches: [ "main", "develop" ] # À chaque push sur main ou develop
  pull_request:
    branches: [ "main", "develop" ] # À chaque Pull Request vers main ou develop

jobs:
  # Job 1 : Build et Test
  build-and-test:
    runs-on: ubuntu-latest # Utilise une machine virtuelle Ubuntu fournie par GitHub

    steps:
    # 1. Récupération du code source
    - uses: actions/checkout@v3

    # 2. Installation de l'environnement .NET 8
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    # 3. Restauration des dépendances (téléchargement des packages NuGet)
    - name: Restore dependencies
      run: dotnet restore NexaShopify.API.sln

    # 4. Compilation du projet (vérifie qu'il n'y a pas d'erreurs de syntaxe)
    - name: Build
      run: dotnet build NexaShopify.API.sln --no-restore --configuration Release

    # 5. Exécution des tests unitaires (Le "Gendarme")
    - name: Test
      run: dotnet test NexaShopify.API.sln --no-build --verbosity normal --configuration Release

  # Job 2 : Vérification Docker (Optionnel mais recommandé)
  # Vérifie que l'image Docker peut être construite correctement
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test # Ce job ne se lance que si les tests passent
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      # On lance la construction depuis la racine du projet (-f spécifie le fichier Dockerfile)
      run: docker build -f Web/NexaShopify.API/Dockerfile .